<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANOTHER WORLD | Vintage Streetwear</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #11100e;
      color: #eee4d3;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 22px;
      background: #201b16;
      border-bottom: 1px solid #8d7656;
    }
    header h2 { letter-spacing: 4px; margin: 0; }
    header p { color: #cdb99a; font-size: 11px; }
    .welcome {
      padding: 90px 20px;
      background: #201b16;
    }
    .welcome h1 {
      font-size: clamp(38px, 8vw, 65px);
      margin: 15px 0;
    }
    .welcome p { line-height: 1.8; color: #cdb99a; }
    .btn {
      display: inline-block;
      padding: 14px 25px;
      margin-top: 20px;
      background: #cdb99a;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
    .photos, .products { padding: 45px 15px; }
    .photos img {
      width: 90%;
      max-width: 500px;
      margin: 12px;
    }
    .product {
      background: #201b16;
      padding: 25px;
      margin: 15px auto;
      max-width: 350px;
    }
    footer { padding: 25px; color: #cdb99a; }
  </style>
</head>
<body>

<header>
  <h2>ANOTHER WORLD</h2>
  <p>VINTAGE STREETWEAR</p>
</header>

<section class="welcome">
  <h1>WELCOME TO<br>ANOTHER WORLD</h1>
  <p>Not just clothes. A different world.</p>
  <p>Discover unique vintage and streetwear pieces.</p>
  <a href="#products" class="btn">EXPLORE COLLECTION</a>
</section>

<section class="photos">
  <h2>OUR WORLD</h2>
  <!-- نضيف صورك الشخصية هنا -->
</section>

<section class="products" id="products">
  <h2>OUR COLLECTION</h2>
  <!-- نضيف الملابس والأسعار هنا -->
</section>

<footer>
  ANOTHER WORLD © 2026
</footer>

</body>
</html>
